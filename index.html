  if(el.dataset.cfg&&!esDueno())return;
  if(el.dataset.cfg){const v=num(el.value);if(v>=0&&v<10)S.idcRate=v;return}
  if(el.id==='q'){S.q=el.value;const pos=el.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);return}
  if(el.dataset.nf&&el.tagName==='INPUT'){const ctx=el.dataset.ctx,Fm=ctx==='tx'?D.nf:S.nfFac;Fm[el.dataset.nf]=el.value;
    if(el.dataset.nf==='neto'){factCalc(Fm);const iv=document.getElementById('nf-'+ctx+'-iva');if(iv)iv.value=Fm.iva}
    const tt=document.getElementById('nf-'+ctx+'-total');if(tt)tt.value=toIn(factTotal(Fm));return}
  if(el.dataset.d&&!el.dataset.re&&el.tagName!=='SELECT'){D[el.dataset.d]=el.value;if(el.dataset.d==='total')autoPago(true);updCuadre();return}
  if(el.dataset.p&&el.tagName==='INPUT'){D.pagos[+el.dataset.i][el.dataset.p]=el.value;updCuadre();return}
  if(el.dataset.r&&el.tagName==='INPUT'){D.rets[+el.dataset.i][el.dataset.r]=el.value;if(el.dataset.r==='importe')autoPago(true);updCuadre();return}
  if(el.dataset.facti){D.facts[el.dataset.facti]=el.value;return}
});
main.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='igObraF'){S.obraF=el.value;render();return}
  if(el.id==='igMaqF'){S.maqF=el.value;render();return}
  if(el.id==='igCbD0'||el.id==='igCbD1'){S[el.id==='igCbD0'?'cbD0':'cbD1']=el.value;render();return}
  if(el.dataset.kfiles){KF_FILES=KF_FILES.concat([...el.files].filter(f=>{if(!ADJ_OK(f)||f.size>10485760){toast('"'+f.name+'": solo fotos o PDF de hasta 10 MB');return false}return true}));render();return}
  if(el.dataset.adjcert){const k=by(S.certifs,el.dataset.adjcert),fs=[...el.files];if(!k||!fs.length||!manejaIng())return;toast('Subiendo…');(async()=>{try{for(const f of fs)k.adj=(k.adj||[]).concat([await subirAdj(f,k.id)]);aud('Modificación','Adjunto agregado a certificación · '+fs.map(f=>f.name).join(', '));toast('Adjunto guardado')}catch(e){toast(e.message||'No se pudo subir')}render()})();return}
  if(el.dataset.ig){const [f,k]=el.dataset.ig.split('.');const F=S[f];if(F){F[k]=el.value;if(f==='kf'&&k==='contratistaId'){F.pct='';F.monto='';render()}else if(f==='kf'&&(k==='pct'||k==='monto')){kfCalc(F,k);render()}}return}
  if(el.id==='bancoF'){S.bancoF=el.value;render();return}
  if(el.id==='ccTipoF'){S.ccTipo=el.value;if(S.ccF&&S.ccTipo&&centro(S.ccF)?.tipo!==S.ccTipo)S.ccF='';render();return}
  if(el.id==='ccF'){S.ccF=el.value;render();return}
  if(el.dataset.cv&&el.dataset.cv!=='q'){S.cv[el.dataset.cv]=el.value;render();return}
  if(el.dataset.e&&S.edit){S.edit.v[el.dataset.id][el.dataset.e]=el.value;if(S.edit.k==='centros'&&el.dataset.e==='tipo')render();if(S.edit.k==='trans'&&el.dataset.e==='pmedio'){const t=by(S.trans,el.dataset.id);if(t&&pagoEditable(t)){ajustaPago(t,S.edit.v[t.id]);render()}}return}
  if(el.dataset.tf&&S.tForm){S.tForm[el.dataset.tf]=el.value;return}
  if(el.dataset.cc&&S.ccForm){S.ccForm[el.dataset.cc]=el.type==='checkbox'?el.checked:el.value;S.ccForm.confirm=false;if(['tipo','clienteId','nuevoTipoObra'].includes(el.dataset.cc))render();return}
  if(el.dataset.grava&&!esDueno())return;
  if(el.dataset.grava){cuenta(el.dataset.grava).gravaIdc=el.checked;toast(cuenta(el.dataset.grava).nombre+(el.checked?' paga':' no paga')+' impuesto D/C');return}
  if(el.dataset.res){if(el.value||el.dataset.res==='rCc'){S[el.dataset.res]=el.value;render()}return}
  if(el.dataset.nf==='fecha'&&el.tagName==='INPUT'){const Fm=el.dataset.ctx==='tx'?D.nf:S.nfFac;if(Fm){Fm.fecha=el.value;Fm.per='';Fm.err='';render()}return}
  if(el.dataset.nf&&el.tagName==='SELECT'){const Fm=el.dataset.ctx==='tx'?D.nf:S.nfFac;const k=el.dataset.nf;Fm[k]=el.value;
    if(k==='terceroId'&&el.value==='__nuevo__'){Fm.ntRazon='';Fm.ntCuit='';render();setTimeout(()=>{const x=document.getElementById('nf-fac-ntRazon');if(x)x.focus()},0);return}
    if(k==='lado')Fm.terceroId='';if(k==='tipo'&&['B','C'].includes(el.value)&&Fm.lado==='credito')Fm.alic='0';if(k==='alic'||k==='tipo')factCalc(Fm);Fm.dup=null;render();return}
  if(el.dataset.d==='terceroId'&&el.value==='__nuevo__'){D.nt={razon:'',cuit:'',err:''};D.terceroId='';D.facts={};render();setTimeout(()=>{const x=document.getElementById('nt-razon');if(x)x.focus()},0);return}
  if(el.dataset.d&&el.tagName==='SELECT'){D[el.dataset.d]=el.value;if(el.dataset.d==='terceroId'){D.facts={};D.nf=null;const ctr=S.contratistas.find(x=>x.terceroId===el.value);if(ctr&&!D.ccId&&centro(ctr.obraId))D.ccId=ctr.obraId}if(el.dataset.d==='moneda')D.pagos.forEach(p=>applyDefaults(p,D.tipo));if(el.dataset.re)render();return}
  if(el.dataset.p&&el.tagName==='SELECT'){const p=D.pagos[+el.dataset.i],k=el.dataset.p;p[k]=el.value;
    if(k==='medio'){p.chequeId='';p.modo='cartera';applyDefaults(p,D.tipo);render()}
    else if(k==='modo'){p.chequeId='';applyDefaults(p,D.tipo);render()}
    else if(k==='origen'){applyDefaults(p,D.tipo);render()}
    else if(k==='chequeId'){const ch=cheque(el.value);p.importe=ch?toIn(ch.importe):'';render()}
    return}
  if(el.dataset.r&&el.tagName==='SELECT'){D.rets[+el.dataset.i][el.dataset.r]=el.value;return}
  if(el.dataset.fact){const fid=el.dataset.fact,f=factura(fid);if(el.checked){const rest=Math.max(0,num(D.total)-sum(Object.values(D.facts),num));D.facts[fid]=toIn(Math.min(saldoFact(f),rest||saldoFact(f)))}else delete D.facts[fid];render();return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.ra){const F=S.auth.f=S.auth.f||{};F[el.dataset.ra]=el.value;if(S.auth.modo==='registro'&&(el.dataset.ra==='nombre'||el.dataset.ra==='apellido')&&!F._iniManual){F.iniciales=sugerirIniciales(F.nombre||'',F.apellido||'');const i=document.getElementById('ra-iniciales');if(i)i.value=F.iniciales}if(el.dataset.ra==='iniciales')F._iniManual=true;return}});
/* Aviso de versión nueva: compara contra la página publicada y ofrece actualizar (evita quedar con una versión vieja en el navegador) */
const BUILD='7-oct 13:00';
async function buscarVersion(){
  if(!REAL||document.getElementById('nuevaver'))return;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD){const d=document.createElement('div');d.id='nuevaver';d.setAttribute('role','alert');
      d.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#e5484d;color:#fff;padding:12px 16px;border-radius:10px;font:600 14px system-ui;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px #0008';
      d.innerHTML='Hay una versión nueva del sistema <button style="background:#fff;color:#111;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer">Actualizar ahora</button>';
      d.querySelector('button').onclick=()=>{location.href=location.pathname+'?v='+Date.now()};document.body.appendChild(d)}}catch(_){}
}
setTimeout(buscarVersion,3000);setInterval(buscarVersion,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)buscarVersion()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();accionAuth({login:'ra-entrar',registro:'ra-crear',olvido:'ra-olvido',nueva:'ra-nueva'}[f.dataset.form])});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.uf)return;const F=S.reg||S.uForm;if(!F)return;F[el.dataset.uf]=el.value;if((el.dataset.uf==='nombre'||el.dataset.uf==='apellido')&&!F._iniManual){F.iniciales=sugerirIniciales(F.nombre,F.apellido);const i=document.getElementById('uf-iniciales');if(i)i.value=F.iniciales}if(el.dataset.uf==='iniciales')F._iniManual=true});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.uf==='rol'&&S.uForm){S.uForm.rol=el.value}if(el.dataset&&el.dataset.urol&&AUTH){const u=S.usuarios.find(x=>x.id===el.dataset.urol);sb.from('perfiles').update({rol:el.value}).eq('id',u.id).then(async({error})=>{if(error){toast('No se pudo: '+error.message);return}await cargarPerfiles();render();toast(u.iniciales+' ahora es '+ROL_TXT(el.value))});return}
if(el.dataset&&el.dataset.urol){const u=S.usuarios.find(x=>x.id===el.dataset.urol);u.rol=el.value;S.audit.push({fecha:nowStamp(),ini:S.user,accion:'Cambio de rol',detalle:u.nombre+' '+u.apellido+' → '+ROL_TXT(u.rol),txId:null});toast(u.iniciales+' ahora es '+ROL_TXT(u.rol))}});
main.addEventListener('focusout',e=>{const el=e.target;if(el.closest&&el.closest('.money')&&!el.readOnly&&el.value.trim()!==''){const f=toIn(num(el.value));if(f!==el.value){el.value=f;el.dispatchEvent(new Event('input',{bubbles:true}))}}});
function updCuadre(){const c=document.getElementById('cuadre');if(c)c.innerHTML=cuadreHTML();const si=document.getElementById('saldosint');if(si&&D.tipo==='interna')si.innerHTML=saldosInner()}

if(AUTH){
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){S.auth={modo:'nueva',f:{pass:'',pass2:''}};S.sesion=null;render();return}if(ev==='SIGNED_OUT'){limpiarDatos();S.sesion=null;if(S.auth.modo!=='enviado')S.auth={modo:'login',f:{}};render();return}if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')setTimeout(()=>alIniciarSesion(session),0)});
}else{S.auth={modo:'login',f:{}}}
render();
})();
