function sdSet(el,fromChange){
  if(!sdOk())return;const [f,k]=el.dataset.sd.split('.');
  const val=el.type==='checkbox'?el.checked:el.value;
  if(f==='sdQ'||f==='sdBajas'){S[f]=val;if(f==='sdQ'){if(!fromChange){const pos=el.selectionStart;render();const q=document.getElementById('sd-q');if(q){q.focus();q.setSelectionRange(pos,pos)}}}else if(fromChange)render();return}
  if(f==='cvVigSel'){S.cvVig[k]=val;if(fromChange)render();return}
  const F=S[f];if(!F)return;F[k]=val;
  if(f==='rcf'&&!fromChange){const p=document.getElementById('rc-prev');if(p)p.innerHTML=rcPrev()}}
function sdChange(el){
  if(!sdOk())return;
  if(el.dataset.impok!=null&&el.dataset.impok!==''){const r=S.imp&&S.imp.rows[+el.dataset.impok];if(r){r.ok=el.checked;render()}return}
  if(el.dataset.impemp!=null&&el.dataset.impemp!==''){const r=S.imp&&S.imp.rows[+el.dataset.impemp];if(r){r.empId=el.value;r.ok=!!el.value&&r.horas>0;render()}return}
  if(el.dataset.sdesc){const x=by(S.escalas,el.dataset.sdesc);if(!x)return;const v=nz(el.value);if(!(v>0)){toast('El valor tiene que ser mayor a 0');render();return}x.valor=v;aud('Modificación','Escala '+x.cat+' · '+money(v));toast('Valor guardado');render();return}
  if(el.dataset.sdemp){if(!S.empresa)S.empresa={id:nid('em'),razon:'CODES SRL',cuit:'',dom:'',art:''};S.empresa[el.dataset.sdemp]=el.value.trim();toast('Datos del empleador guardados');return}
  const [f,k]=el.dataset.sd.split('.');sdSet(el,true);
  if(f==='emf'){const F=S.emf;if(!F)return;if(k==='convId'){F.zona='';F.cat='';const zs=F.convId?zonasDe(F.convId):[];if(zs.length===1)F.zona=zs[0]}if(k==='zona'){const cs=F.convId?catsDe(F.convId,F.zona):[];if(!cs.includes(F.cat))F.cat=''}if(el.dataset.re)render();return}
  if(f==='rcf'){const F=S.rcf;if(!F)return;if(k==='empId'||k==='liq')rcHoras(F);if(el.dataset.re)render();else{const p=document.getElementById('rc-prev');if(p)p.innerHTML=rcPrev()}return}
  if(el.dataset.re)render()}

function kfCalc(F,from){const c=by(S.contratistas,F.contratistaId);if(!c)return;const prev=certPct(c.id);
  if(from==='pct'){const p=num(F.pct);F.monto=p>prev?toIn(Math.round((p-prev)/100*c.monto*100)/100):''}
  else if(from==='monto'){const m=num(F.monto);F.monto=m>0?toIn(m):'';F.pct=m>0?String(Math.round((prev+m/c.monto*100)*100)/100).replace('.',','):''}}

  const c=F&&by(S.contratistas,F.contratistaId),prev=c?certPct(c.id):0,cer=c?certMonto(c.id):0,pend=c?antPend(c.id):0;
  const form=F?`<section class="panel"><h2>Nueva certificación</h2>${errBox(F)}<div class="fields">

   ${fld('kf-fecha','Fecha <em>*</em>',`<input id="kf-fecha" type="date" data-ig="kf.fecha" value="${esc(F.fecha)}">`)}
   ${c?`<div class="f wide"><div class="ok-box" style="margin:0">Monto acordado <b>${money(c.monto)}</b> · certificado hasta ahora <b>${money(cer)}</b> (${prev.toFixed(1)}%) · resta <b>${money(c.monto-cer)}</b>${pend>0.005?` · anticipo por descontar <b>${money(pend)}</b>`:''}</div></div>`:''}
   ${fld('kf-pct','Avance acumulado (%)',`<input id="kf-pct" data-ig="kf.pct" value="${esc(F.pct)}" inputmode="decimal" placeholder="Ej: 40">`,'El total de la obra del contratista hasta hoy, de 0 a 100.')}

function cbSave(fam='comb'){
  const FM=FAM[fam],TT=FM.T,LS=S[FM.arr];
  const B=S.bf;B.err='';B.ok='';const fail=m=>{B.err=m;render()};
  const l=num(B.litros);
  if(!B.maqId)return fail('Tocá la máquina a la que se le cargó.');
  if(obras().some(o=>o.activo!==false&&!o.fin)&&!B.obraId)return fail('Tocá la obra para la que se cargó.');
  if(!B.tipo||!TT[B.tipo])return fail('Tocá el tipo de '+FM.nom+'.');
  if(estaciones().length&&!B.estId)return fail('Tocá la estación de servicio donde se cargó.');
  if(!B.fh)return fail('Cargá la fecha y la hora.');
  if(!(l>0))return fail('Escribí cuántos litros se cargaron.');
  const m=centro(B.maqId),precio=S.precios[B.tipo]||0;
  LS.push({id:nid('cb'),maqId:B.maqId,obraId:B.obraId||'',tipo:B.tipo,fh:fhISO(B.fh),litros:l,precio,ini:S.user,estId:B.estId||'',reg:new Date().toISOString()});
  aud('Alta',FM.Nom+' · '+m.codigo+' · '+lts(l)+' '+TT[B.tipo]);
  const mine=combDe(B.maqId,fam),tl=sum(mine,x=>x.litros),tc=sum(mine,cbCosto);
  S.bf=newBf();S.bf.ok='Guardado: '+lts(l)+' de '+TT[B.tipo]+(precio?' · '+money(l*precio):'')+' en '+m.nombre+'. Total de la máquina: '+lts(tl)+(tc?' · '+money(tc):'');render();toast('Carga guardada')}

function irRango(){const [y,m]=TODAY.split('-').map(Number),pad=n=>String(n).padStart(2,'0'),last=(y,m)=>new Date(y,m,0).getDate();
  if(S.irPer==='mes')return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${last(y,m)}`];
  if(S.irPer==='ant'){const py=m===1?y-1:y,pm=m===1?12:m-1;return [`${py}-${pad(pm)}-01`,`${py}-${pad(pm)}-${last(py,pm)}`]}
  if(S.irPer==='anio')return [`${y}-01-01`,`${y}-12-31`];
  return ['0000-01-01','9999-12-31']}
function irDatos(){const [d0,d1]=irRango(),en=x=>{const d=fhDia(x.fh);return d>=d0&&d<=d1};
  const cb=S.comb.filter(en),ar=S.arreglos.filter(en);
  const po=cbAgrupa(cb,x=>x.obraId||''),pm=cbAgrupa(cb,x=>x.maqId);
  return {cb,ar,po,pm,tl:sum(cb,x=>x.litros),tc:sum(cb,cbCosto),ta:sum(ar,x=>x.costo)}}

(function(){

 let pop=null,inp=null,vy=0,vm=0;
 const p2=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d);

 function pinta(){

   g+=`<button type="button" data-cal-d="${v}" class="${d.getMonth()!==vm?'out':''} ${v===TODAY?'hoy':''} ${v===sel?'sel':''}" ${dis?'disabled':''} aria-label="${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}" ${v===sel?'aria-pressed="true"':''}>${d.getDate()}</button>`}

  if(el.dataset.nf==='fecha'&&el.tagName==='INPUT'){const Fm=el.dataset.ctx==='tx'?D.nf:S.nfFac;if(Fm){Fm.fecha=el.value;Fm.per='';Fm.err='';render()}return}
  if(el.dataset.nf&&el.tagName==='SELECT'){const Fm=el.dataset.ctx==='tx'?D.nf:S.nfFac;const k=el.dataset.nf;Fm[k]=el.value;
    if(k==='terceroId'&&el.value==='__nuevo__'){Fm.ntRazon='';Fm.ntCuit='';render();setTimeout(()=>{const x=document.getElementById('nf-fac-ntRazon');if(x)x.focus()},0);return}
    if(k==='lado')Fm.terceroId='';if(k==='tipo'&&['B','C'].includes(el.value)&&Fm.lado==='credito')Fm.alic='0';if(k==='alic'||k==='tipo')factCalc(Fm);Fm.dup=null;Fm.dupOk=false;render();return}
  if(el.dataset.d==='terceroId'&&el.value==='__nuevo__'){D.nt={razon:'',cuit:'',err:''};D.terceroId='';D.facts={};render();setTimeout(()=>{const x=document.getElementById('nt-razon');if(x)x.focus()},0);return}
  if(el.dataset.d&&el.tagName==='SELECT'){D[el.dataset.d]=el.value;if(el.dataset.d==='terceroId'){D.facts={};D.nf=null;const ctr=S.contratistas.find(x=>x.terceroId===el.value);if(ctr&&!D.ccId&&centro(ctr.obraId))D.ccId=ctr.obraId}if(el.dataset.d==='moneda')D.pagos.forEach(p=>applyDefaults(p,D.tipo));if(el.dataset.re)render();return}
  if(el.dataset.p&&el.tagName==='SELECT'){const p=D.pagos[+el.dataset.i],k=el.dataset.p;p[k]=el.value;
    if(k==='medio'){p.chequeId='';p.modo='cartera';if(p.medio==='transferencia'){p.origen='';p.destino=''}applyDefaults(p,D.tipo);render()}
    else if(k==='modo'){p.chequeId='';applyDefaults(p,D.tipo);render()}
    else if(k==='origen'){applyDefaults(p,D.tipo);render()}
    else if(k==='chequeId'){const ch=cheque(el.value);p.importe=ch?toIn(ch.importe):'';render()}
    return}
  if(el.dataset.r&&el.tagName==='SELECT'){D.rets[+el.dataset.i][el.dataset.r]=el.value;return}
  if(el.dataset.fact){const fid=el.dataset.fact,f=factura(fid);if(el.checked){const rest=Math.max(0,num(D.total)-sum(Object.values(D.facts),num));D.facts[fid]=toIn(Math.min(saldoFact(f),rest||saldoFact(f)))}else delete D.facts[fid];render();return}

document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.ra){const F=S.auth.f=S.auth.f||{};F[el.dataset.ra]=el.value;if(S.auth.modo==='registro'&&(el.dataset.ra==='nombre'||el.dataset.ra==='apellido')&&!F._iniManual){F.iniciales=sugerirIniciales(F.nombre||'',F.apellido||'');const i=document.getElementById('ra-iniciales');if(i)i.value=F.iniciales}if(el.dataset.ra==='iniciales')F._iniManual=true;return}});
/* Aviso de versión nueva: compara contra la página publicada y ofrece actualizar (evita quedar con una versión vieja en el navegador) */
/* Versión visible del programa: subir en cada entrega (Codes 0.1 → 0.2 … 0.9 → 1.0 → 1.1 … hasta 100). BUILD fuerza el aviso de "versión nueva". */
const VERSION='Codes 1.22';
const BUILD='29-oct 20:30';
async function buscarVersion(){
  if(!REAL||document.getElementById('nuevaver'))return;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD){const d=document.createElement('div');d.id='nuevaver';d.setAttribute('role','alert');
      d.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#e5484d;color:#fff;padding:12px 16px;border-radius:10px;font:600 14px system-ui;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px #0008';
      d.innerHTML='Hay una versión nueva del sistema <button style="background:#fff;color:#111;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer">Actualizar ahora</button>';
      d.querySelector('button').onclick=()=>{location.href=location.pathname+'?v='+Date.now()};document.body.appendChild(d)}}catch(_){}
}
setTimeout(buscarVersion,3000);setInterval(buscarVersion,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)buscarVersion()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();accionAuth({login:'ra-entrar',registro:'ra-crear',olvido:'ra-olvido',nueva:'ra-nueva'}[f.dataset.form])});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.uf)return;const F=S.reg||S.uForm;if(!F)return;F[el.dataset.uf]=el.value;if((el.dataset.uf==='nombre'||el.dataset.uf==='apellido')&&!F._iniManual){F.iniciales=sugerirIniciales(F.nombre,F.apellido);const i=document.getElementById('uf-iniciales');if(i)i.value=F.iniciales}if(el.dataset.uf==='iniciales')F._iniManual=true});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.uf==='rol'&&S.uForm){S.uForm.rol=el.value}if(el.dataset&&el.dataset.urol&&AUTH){const u=S.usuarios.find(x=>x.id===el.dataset.urol);sb.from('perfiles').update({rol:el.value}).eq('id',u.id).then(async({error})=>{if(error){toast('No se pudo: '+error.message);return}await cargarPerfiles();render();toast(u.iniciales+' ahora es '+ROL_TXT(el.value))});return}
if(el.dataset&&el.dataset.urol){const u=S.usuarios.find(x=>x.id===el.dataset.urol);u.rol=el.value;S.audit.push({fecha:nowStamp(),ini:S.user,accion:'Cambio de rol',detalle:u.nombre+' '+u.apellido+' → '+ROL_TXT(u.rol),txId:null});toast(u.iniciales+' ahora es '+ROL_TXT(u.rol))}});
main.addEventListener('focusout',e=>{const el=e.target;if(el.closest&&el.closest('.money')&&!el.readOnly&&el.value.trim()!==''){const f=toIn(num(el.value));if(f!==el.value){el.value=f;el.dispatchEvent(new Event('input',{bubbles:true}))}}});
function updCuadre(){const c=document.getElementById('cuadre');if(c)c.innerHTML=cuadreHTML();const si=document.getElementById('saldosint');if(si&&D.tipo==='interna')si.innerHTML=saldosInner()}

if(AUTH){
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){S.auth={modo:'nueva',f:{pass:'',pass2:''}};S.sesion=null;render();return}if(ev==='SIGNED_OUT'){limpiarDatos();S.sesion=null;if(S.auth.modo!=='enviado')S.auth={modo:'login',f:{}};render();return}if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')setTimeout(()=>alIniciarSesion(session),0)});
}else{S.auth={modo:'login',f:{}}}
render();
})();
